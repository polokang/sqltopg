# sqltopg —— SQL Server → PostgreSQL 同步服务
#
# 与 adminpage-api 同一套模式：构建镜像 → 推 ACR → SSH 到 Azure VM → docker run。
#
# ⚠️ 凭据**绝不打进镜像**（Dockerfile 里那行 COPY .env 已于 2026-09-09 移除），
#    而是由服务器上的一个文件提供，运行时用 --env-file 读：
#
#        /home/aquacentosadmin/sqltopg/.env
#
#    该文件由人工维护，只放两个连接串，权限 600。流水线因此**不需要**持有任何
#    凭据 —— 换口令只改服务器上那一个文件，不用动 pipeline 变量。
#
#    ⚠️ 该文件必须是 **LF 行尾、值不带引号**。Docker 的 --env-file 与 dotenv 不同：
#       它不剥引号、也不处理 CRLF，`"…"` 以及行尾的 CR 都会变成值的一部分。
#       末位参数 trustServerCertificate 被污染后表现为
#       "self-signed certificate" 连接失败 —— 错误信息完全指不到真正原因。
#       （v2.0 的 src/dbConfig.js 会兜住并告警，但不要依赖它。）
#
# ⚠️ 本服务**只能跑单实例**。它每轮做全量 UPSERT + 孤儿清理，两个实例同时跑
#    会在 DELETE 上互相干扰。所以部署脚本是"先 stop/rm 旧容器再 run"，
#    不要改成滚动更新或多副本。

trigger:
  - main

resources:
  - repo: self

variables:
  # 与 adminpage-api 共用同一个 ACR，可以直接复用那条 service connection
  dockerRegistryServiceConnection: 'b88aab1b-53f7-4728-9628-8db6ffa52604'
  containerRegistry: 'adminpage.azurecr.io'
  imageRepository: 'sqltopg'                 # 与 ACR 里已有的仓库同名（adminpage.azurecr.io/sqltopg）
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  # 用 git sha 而不是写死的 'test' —— 出问题时能确定线上跑的到底是哪个 commit，
  # 也才有办法回滚（adminpage-api 的 tag 写死成 'test'，回滚时无从下手）
  tag: '$(Build.SourceVersion)'
  containerName: 'sqltopg_container'
  # 只绑 127.0.0.1：本服务没有入站业务流量，/health 只给 VM 上的探针用，
  # 不需要、也不应该暴露到公网
  healthPort: '8087'
  # 服务器上存放凭据的文件，人工维护（见文件头说明）
  envFile: '/home/aquacentosadmin/sqltopg/.env'
  vmImageName: 'ubuntu-latest'

stages:
  - stage: Build
    displayName: Build and push image
    jobs:
      - job: Build
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: Docker@2
            displayName: Build and push to ACR
            inputs:
              command: buildAndPush
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(tag)
                latest

  - stage: Deploy
    displayName: Deploy to Azure VM
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: Deploy
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: SSH@0
            displayName: Pull and restart container on VM
            inputs:
              sshEndpoint: 'SSH AquaDev'
              runOptions: 'commands'
              commands: |
                set -e
                docker pull $(containerRegistry)/$(imageRepository):$(tag)
                # 单实例：先停旧的再起新的（见文件头的说明）
                docker stop $(containerName) || true
                docker rm   $(containerName) || true
                # 凭据文件必须在位。少了它容器照样能起来、HTTP 服务和健康检查都正常，
                # 只是同步一直失败 —— 所以在这里硬性拦一道，别让部署"看起来成功"。
                test -f $(envFile) || { echo "✗ 缺少凭据文件 $(envFile)"; exit 1; }
                docker run -d \
                  --name $(containerName) \
                  --restart unless-stopped \
                  -p 127.0.0.1:$(healthPort):3000 \
                  --log-opt max-size=10m --log-opt max-file=3 \
                  --env-file $(envFile) \
                  -e PORT=3000 \
                  -e SYNC_TIMEZONE=Australia/Brisbane \
                  -e SYNC_AT_HOUR=0 \
                  -e SYNC_ON_STARTUP=true \
                  $(containerRegistry)/$(imageRepository):$(tag)
                # 等健康检查转 healthy 再宣告成功，否则容器起不来也会显示部署通过。
                #
                # ⚠️ 这里**不能用 $(...) 做命令替换** —— Azure Pipelines 的变量宏
                #    也是 $(name) 语法，会在脚本执行前把 $(seq 1 30)、
                #    $(docker inspect …) 当成未定义变量替换成空串。用反引号，
                #    并用纯 shell 计数代替 seq。单个 $ 的变量（$i、$s）不受影响。
                i=0
                while [ $i -lt 30 ]; do
                  s=`docker inspect -f '{{.State.Health.Status}}' $(containerName) 2>/dev/null || echo starting`
                  if [ "$s" = "healthy" ]; then echo "容器已 healthy"; break; fi
                  i=`expr $i + 1`
                  if [ $i -eq 30 ]; then
                    echo "✗ 容器 60 秒内未转 healthy，最近日志："
                    docker logs --tail 50 $(containerName)
                    exit 1
                  fi
                  sleep 2
                done
                # 打印本次启动同步的结果，部署日志里直接能看到通没通
                docker logs --tail 40 $(containerName)
