# sqltopg —— SQL Server → PostgreSQL 同步服务
#
# 构建镜像 → 推 ACR → SSH 到 Azure VM → docker compose pull && up -d。
# （adminpage-api 用的是 docker run；这里改用 compose，与服务器上的手工操作一致。）
#
# ⚠️ 凭据**绝不打进镜像**（Dockerfile 里那行 COPY .env 已于 2026-09-09 移除），
#    而是由服务器上的部署目录提供：
#
#        /home/aquacentosadmin/sqltopg/
#          ├── docker-compose.yml   服务定义（仓库根目录同名文件，首次 scp 过来）
#          └── .env                 凭据，被 compose 以 volume 挂进容器的 /app/.env
#
#    这两个文件由人工维护，流水线**不持有任何凭据** —— 换口令只改服务器上那一个
#    文件，不用动 pipeline 变量。
#
#    ⚠️ .env 的权限：镜像以非 root 的 uid 1001 运行，宿主机文件要
#       chmod 644（父目录 chmod 700 做隔离）。设成 600 容器读不到，
#       应用会在启动时明确报错（src/dbConfig.js 的 requireEnv），不会静默失败。
#
# ⚠️ 本服务**只能跑单实例**。它每轮做全量 UPSERT + 孤儿清理，两个实例同时跑
#    会在 DELETE 上互相干扰。compose 的 up -d 是"先停旧容器再起新的"，符合要求；
#    但不要 `--scale`，也不要在多台机器上同时起。

trigger:
  - main

resources:
  - repo: self

variables:
  # 与 adminpage-api 共用同一个 ACR，可以直接复用那条 service connection
  dockerRegistryServiceConnection: 'b88aab1b-53f7-4728-9628-8db6ffa52604'
  containerRegistry: 'adminpage.azurecr.io'
  imageRepository: 'sqltopg'                 # 与 ACR 里已有的仓库同名（adminpage.azurecr.io/sqltopg）
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  # 必须与 docker-compose.yml 里的 container_name 一致，否则健康等待查不到容器
  containerName: 'sqltopg'
  # 只绑 127.0.0.1：本服务没有入站业务流量，/health 只给 VM 上的探针用，
  # 不需要、也不应该暴露到公网
  healthPort: '8087'
  # 服务器上的部署目录，里面放 docker-compose.yml 与 .env（人工维护）
  deployDir: '/home/aquacentosadmin/sqltopg'
  vmImageName: 'ubuntu-latest'

stages:
  - stage: Build
    displayName: Build and push image
    jobs:
      - job: Build
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: Docker@2
            displayName: Build and push to ACR
            inputs:
              command: buildAndPush
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              containerRegistry: $(dockerRegistryServiceConnection)
              # 只维护 latest 一个 tag（按要求：ACR 里只保留最新镜像）。
              # ⚠️ 代价：没有历史 tag 可回滚。真要回滚只能重新构建上一个 commit，
              #    或临时改成也推 $(Build.SourceVersion)。
              tags: |
                latest

  - stage: Deploy
    displayName: Deploy to Azure VM
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: Deploy
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: SSH@0
            displayName: Pull and restart container on VM
            inputs:
              sshEndpoint: 'SSH AquaDev'
              runOptions: 'commands'
              commands: |
                set -e
                cd $(deployDir)
                # 这两个文件由人工维护在服务器上，不由流水线下发：
                #   docker-compose.yml  服务定义（仓库里有同名文件，首次部署 scp 过来）
                #   .env                凭据
                # 少了任何一个都要立刻失败 —— 尤其是 .env：缺了它容器照样能起来、
                # HTTP 服务和健康检查都正常，只是同步一直失败，部署会"看起来成功"。
                test -f docker-compose.yml || { echo "✗ $(deployDir)/docker-compose.yml 不存在"; exit 1; }
                test -f .env              || { echo "✗ $(deployDir)/.env 不存在"; exit 1; }
                docker compose pull   # compose 里钉的是 :latest
                # 单实例：compose 会先停旧容器再起新的（见 compose 文件头的说明）
                docker compose up -d
                # 等健康检查转 healthy 再宣告成功，否则容器起不来也会显示部署通过。
                #
                # ⚠️ 这里**不能用 $(...) 做命令替换** —— Azure Pipelines 的变量宏
                #    也是 $(name) 语法，会在脚本执行前把 $(seq 1 30)、
                #    $(docker inspect …) 当成未定义变量替换成空串。用反引号，
                #    并用纯 shell 计数代替 seq。单个 $ 的变量（$i、$s）不受影响。
                i=0
                while [ $i -lt 30 ]; do
                  s=`docker inspect -f '{{.State.Health.Status}}' $(containerName) 2>/dev/null || echo starting`
                  if [ "$s" = "healthy" ]; then echo "容器已 healthy"; break; fi
                  i=`expr $i + 1`
                  if [ $i -eq 30 ]; then
                    echo "✗ 容器 60 秒内未转 healthy，最近日志："
                    docker logs --tail 50 $(containerName)
                    exit 1
                  fi
                  sleep 2
                done
                # 打印本次启动同步的结果，部署日志里直接能看到通没通
                docker logs --tail 40 $(containerName)
